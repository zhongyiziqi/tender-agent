[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tender-agent-backend"
version = "0.1.0"
description = "Procurement-side tender agent backend"
requires-python = ">=3.11,<3.12"
dependencies = [
  "alembic>=1.18,<2",
  "beautifulsoup4>=4.14,<5",
  "ddgs>=9.16,<10",
  "fastapi>=0.135,<0.136",
  "langchain>=1.2,<1.3",
  "langchain-openai>=1.1,<1.2",
  "langgraph>=1.1,<1.2",
  "pydantic-settings>=2.13,<3",
  "pypdf>=6.9,<7",
  "python-docx>=1.2,<2",
  "python-multipart>=0.0.22,<0.1",
  "reportlab>=4.4,<5",
  "sqlalchemy>=2.0,<2.1",
  "uvicorn>=0.42,<0.43",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "httpx>=0.28,<0.29", "ruff>=0.15,<0.16"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
